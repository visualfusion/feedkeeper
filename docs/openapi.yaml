openapi: 3.1.0
info:
  title: FeedKeeper native API
  version: "1"
  license: { name: MIT, url: "https://github.com/visualfusion/feedkeeper/blob/main/LICENSE" }
  description: |
    The API for native apps, served under `/api/v1`. Design notes and what is still planned
    are in `docs/design/native-api.md`. A test keeps this file in step with the implemented routes.

    Authenticate with `Authorization: Bearer <token>`: a device token from pairing, or a personal
    access token. Read-only tokens can call every `GET` and nothing that changes data.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - { name: Meta }
  - { name: Devices }
  - { name: Sync }
  - { name: Subscriptions }
  - { name: Folders }
  - { name: Keywords }
  - { name: Articles }
  - { name: Notes }
  - { name: Edition }
  - { name: NativePreferences }
  - { name: Images }
  - { name: Inbox }
paths:
  /meta:
    get:
      tags: [Meta]
      summary: Server identity and abilities
      description: Public. Clients read `features` instead of guessing from the version.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Meta" } } } }
  /pairing-codes:
    post:
      tags: [Devices]
      summary: Create a one-time pairing code
      description: Called by the web app with the user's session. The code is valid for 10 minutes and replaces any earlier one.
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PairingCode" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/pair:
    post:
      tags: [Devices]
      summary: Exchange a pairing code for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName, platform]
              properties:
                code: { type: string, description: "As shown, or typed without dashes and in any case" }
                deviceName: { type: string, maxLength: 100 }
                platform: { type: string, maxLength: 40, examples: [ios] }
                appVersion: { type: string, maxLength: 40 }
      responses:
        "201":
          description: Paired. The token is shown only here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: integer }
                  token: { type: string }
                  user: { type: object, properties: { id: { type: integer }, email: { type: string }, displayName: { type: string } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { description: Too many attempts }
  /me:
    get:
      tags: [Devices]
      summary: The signed-in user
      description: |
        Uncached account profile. Technical support from /meta, account capabilities and
        token scope are independent. Missing capabilities on an older server mean legacy
        compatibility; missing keys in an existing feature map deny access.
        See docs/design/native-api.md for operation mappings and downgrade behavior.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email, displayName, role, scope, deviceId, capabilities]
                properties:
                  id: { type: integer }
                  email: { type: string }
                  displayName: { type: string }
                  role: { type: string, enum: [admin, user] }
                  scope: { type: string, enum: [read, write] }
                  deviceId: { type: [integer, "null"] }
                  capabilities: { $ref: "#/components/schemas/AccountCapabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices:
    get:
      tags: [Devices]
      summary: Paired devices
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
  /devices/{id}:
    delete:
      tags: [Devices]
      summary: Revoke a device
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /sync:
    get:
      tags: [Sync]
      summary: Changes to the user's own data since a position
      description: |
        The log holds one entry per object, so `since=0` returns the complete state. A client whose
        position is older than a forgotten deletion gets `410 resync_required` and starts over from 0.
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPage" } } } }
        "410": { description: resync_required }
  /mutations:
    post:
      tags: [Sync]
      summary: Apply changes made offline
      description: Each mutation has a client-made id, so a retried request changes nothing. Read, saved and reading position are last-writer-wins per field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutations]
              properties:
                mutations: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/Mutation" } }
      responses:
        "200":
          description: One result per mutation, in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/MutationResult" } }
                  seq: { type: integer, description: Current end of the change log }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/ReadOnly" }
  /overview:
    get:
      tags: [Subscriptions]
      summary: Counts for the whole account
      description: Cheap enough for widgets and the app badge.
      responses:
        "200": { description: OK }
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: Subscriptions with unread counts and polling health
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Subscription" } } } } }
    post:
      tags: [Subscriptions]
      summary: Subscribe to a feed or website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                label: { type: [string, "null"], maxLength: 200 }
                folderId: { type: [integer, "null"] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { description: "already_subscribed, or multiple_feeds_found with a list of candidates" }
  /subscriptions/order:
    put:
      tags: [Subscriptions]
      summary: Set the order of all subscriptions
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer } } } } } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Invalid" }
  /subscriptions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [Subscriptions]
      summary: Change a subscription
      description: A new `url` is checked before it replaces the old one; the returned id may differ from the one passed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                label: { type: [string, "null"], maxLength: 200 }
                folderId: { type: [integer, "null"] }
                pollIntervalMinutes: { type: integer, minimum: 1, maximum: 10080 }
                fullTextMode: { type: string, enum: [auto, never] }
                notify: { type: boolean }
                badge: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Subscriptions]
      summary: Unsubscribe
      description: Saved articles of the feed stay readable.
      responses:
        "204": { description: Done }
        "404": { $ref: "#/components/responses/NotFound" }
  /subscriptions/{id}/refresh:
    post:
      tags: [Subscriptions]
      summary: Check one feed now
      description: Concurrent triggers share an attempt. Responses add deferred (boolean) and optional retryAt (Unix milliseconds) when work remains queued; callers must not busy-loop retries.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /refresh:
    post:
      tags: [Subscriptions]
      summary: Check all feeds now
      responses:
        "200": { description: "refreshed, newItems, errors and deferred counts; deferred work remains queued" }
  /subscriptions/{id}/icon:
    get:
      tags: [Images]
      summary: The feed's raster icon, delivered by this server
      description: Discovery prefers SVG artwork, then the largest declared raster or touch icons, including linked web app manifests. SVG sources are rendered as 512-pixel-wide PNGs; ICO sources use their largest embedded image. Raster sources keep their resolution. Failed candidates fall back to the next declared image, then the previous source and favicon.ico. Icons are rechecked during weekly feed polls, including when the feed returns 304. A changed image produces a new iconHash and a subscription upsert in /sync.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: v, in: query, schema: { type: string }, description: "Optional content hash for immutable caching" }
      responses:
        "200": { description: "PNG, JPEG or another supported raster image. ETag is the iconHash; matching v enables private immutable caching.", content: { "image/*": { schema: { type: string, format: binary } } } }
        "304": { description: If-None-Match matched the current iconHash }
        "404": { $ref: "#/components/responses/NotFound" }
  /discover:
    post:
      tags: [Subscriptions]
      summary: Find the feeds of a website
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Invalid" }
  /opml:
    get:
      tags: [Subscriptions]
      summary: Export subscriptions as OPML
      responses:
        "200": { description: OPML 2.0, content: { text/x-opml: { schema: { type: string } } } }
    post:
      tags: [Subscriptions]
      summary: Import subscriptions from OPML
      description: "Send the XML as the body (text/xml) or as JSON { opml: \"...\" }."
      responses:
        "200": { description: Import result }
        "400": { $ref: "#/components/responses/Invalid" }
  /folders:
    get:
      tags: [Folders]
      summary: Folders with counts
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Folder" } } } } }
    post:
      tags: [Folders]
      summary: Create a folder
      description: Creating a folder that already exists returns it, so a retried request is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                iconSymbol: { type: [string, "null"], maxLength: 100 }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } } }
  /folders/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [Folders]
      summary: Rename or re-icon a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                iconSymbol: { type: [string, "null"], maxLength: 100 }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: folder_name_taken }
    delete:
      tags: [Folders]
      summary: Delete a folder
      description: Its subscriptions stay and move out of any folder.
      responses:
        "204": { description: Done }
        "404": { $ref: "#/components/responses/NotFound" }
  /muted-keywords:
    get:
      tags: [Keywords]
      summary: Muted keywords
      responses:
        "200": { description: OK }
    post:
      tags: [Keywords]
      summary: Mute a keyword
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [keyword], properties: { keyword: { type: string, maxLength: 100 } } } } }
      responses:
        "201": { description: Created }
  /muted-keywords/{id}:
    delete:
      tags: [Keywords]
      summary: Remove a muted keyword
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Done }
  /search:
    get:
      tags: [Articles]
      summary: Search articles using full-text search
      description: Searches titles, snippets, content and user notes using SQLite FTS5 with BM25 relevance ranking.
      parameters:
        - { name: q, in: query, required: true, description: "Search query string", schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: subscriptionId, in: query, schema: { type: integer } }
        - { name: folderId, in: query, schema: { type: integer } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: saved, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, date], default: relevance } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: include, in: query, schema: { type: string, enum: [content] } }
        - { $ref: "#/components/parameters/Images" }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        "400": { $ref: "#/components/responses/Invalid" }
  /items:
    get:
      tags: [Articles]
      summary: Articles, newest added first, with a cursor
      description: |
        Compact by default. Use `nextCursor` as `before` for older pages and `newestCursor` as `after`
        for newly added articles. With `include=content` the page is limited to 50 articles.
      parameters:
        - { name: subscriptionId, in: query, schema: { type: integer } }
        - { name: folderId, in: query, schema: { type: integer } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: saved, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: "Searches titles and summaries, and the full text of saved articles", schema: { type: string, maxLength: 200 } }
        - { name: since, in: query, schema: { type: string }, description: Published at or after this ISO date or date-time }
        - { name: until, in: query, schema: { type: string }, description: Published at or before this ISO date or date-time }
        - { name: after, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: include, in: query, schema: { type: string, enum: [content] } }
        - { $ref: "#/components/parameters/Images" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  newestCursor: { type: [string, "null"] }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Invalid" }
  /items/bundle:
    get:
      tags: [Articles]
      summary: Several articles with all their content
      description: For storing offline copies. Images go through this server by default, so the app can keep them.
      parameters:
        - { name: ids, in: query, required: true, description: Up to 50 comma separated article ids, schema: { type: string } }
        - { $ref: "#/components/parameters/Images" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Item" } } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }
  /items/prepare:
    post:
      tags: [Articles]
      summary: Prepare selected article content in the background
      description: Requires fulltext capability and a write token. Validates access to every ID before enqueueing. Does not wait for publisher requests. Full texts and per-article outcomes are available via ordinary item reads and item_content sync changes. Respects fullTextMode and retryAt; duplicate requests share jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer, minimum: 1 } }
      responses:
        "202":
          description: IDs queued for preparation
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: array, items: { type: integer } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: queue_full; retry later }
  /items/read-all:
    post:
      tags: [Articles]
      summary: Mark articles as read
      requestBody:
        content: { application/json: { schema: { type: object, properties: { subscriptionId: { type: integer }, folderId: { type: integer } } } } }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: The number of articles marked }
  /items/{id}:
    get:
      tags: [Articles]
      summary: One article with its content
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Images" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/full-text:
    post:
      tags: [Articles]
      summary: Fetch and cache the full article
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: force, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Images" }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: The article with `fullTextHtml`, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "409": { description: full_text_disabled for this subscription }
        "504": { description: Publisher request timed out }
        "422": { description: consent_wall, paywall, bot_blocked, partial or could_not_extract_content }
  /items/{id}/image:
    get:
      tags: [Images]
      summary: An image the article shows, through this server
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: src, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: A raster image, content: { "image/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { description: Not a supported image }
  /archive/images/{imageId}:
    get:
      tags: [Images]
      summary: An image stored with a saved article
      parameters: [{ name: imageId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: The stored image, content: { "image/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /items/{id}/note:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Notes]
      summary: Note for an article
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemNote" } } } }
        "404": { description: "item_not_found, or note_not_found with current deleted state and revision", content: { application/json: { schema: { $ref: "#/components/schemas/NoteNotFound" } } } }
    put:
      tags: [Notes]
      summary: Create or update note for an article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 100000 }
                expectedRevision: { type: integer, minimum: 0, description: "Last seen revision, including a deleted note's tombstone revision. Omit only for unconditional writes." }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemNote" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: revision_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/NoteConflict" } } } }
    delete:
      tags: [Notes]
      summary: Delete note for an article
      requestBody:
        description: "Use expectedRevision to avoid deleting an edit from another device. Omit only for unconditional deletion."
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        "204": { description: Done }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: revision_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/NoteConflict" } } } }
  /items/{id}/note.md:
    get:
      tags: [Notes]
      summary: Single article note as Markdown
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Note in Markdown format, content: { "text/markdown": { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /notes/export:
    get:
      tags: [Notes]
      summary: Export all article notes as Markdown
      responses:
        "200": { description: All notes in Markdown format, content: { "text/markdown": { schema: { type: string } } } }
  /edition:
    get:
      tags: [Edition]
      summary: Central curated edition
      description: |
        The active automatic or MCP-curated issue, preserving itemIds order. Reading and
        refreshing do not reshuffle it. This GET never generates an issue. Expired and dismissed
        issues return 404 with current EditionState; network errors must not discard offline copies.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Edition" } } } }
        "404": { description: "no_edition, with current EditionState", content: { application/json: { schema: { $ref: "#/components/schemas/EditionError" } } } }
    delete:
      tags: [Edition]
      summary: Dismiss or delete active curated edition
      description: |
        Dismisses the shared issue and retains its revision. Automatic scheduling waits until
        the next time slot. New clients supply expectedRevision and requestId; an empty body
        remains supported for older clients. The receipt is retained for at least 35 days.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                requestId: { type: string, format: uuid }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { description: "revision_conflict with current EditionState, or request_id_reused", content: { application/json: { schema: { $ref: "#/components/schemas/EditionError" } } } }
  /edition/state:
    get:
      tags: [Edition]
      summary: Current issue or retained revision after expiry and dismissal
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EditionState" } } } }
  /edition/candidates:
    get:
      tags: [Edition]
      summary: Compact candidates and preferences for curating an issue
      description: Unread subscribed articles from the last seven days, excluding muted keywords and hidden app sections. Candidate gathering is bounded to 40 per source and 4000 total; the shortlist starts with a diversified selection. Original HTML is not included.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [preferences, current, candidates]
                properties:
                  preferences: { $ref: "#/components/schemas/NativePreferences" }
                  current: { $ref: "#/components/schemas/EditionState" }
                  candidates: { type: array, items: { $ref: "#/components/schemas/EditionCandidate" } }
        "400": { $ref: "#/components/responses/Invalid" }
  /edition/generate:
    post:
      tags: [Edition]
      summary: Ensure an automatic issue exists or request a new selection
      description: |
        Defaults to keeping an active issue, including a curated one. force=true requires
        expectedRevision and never replaces active curation; dismiss that issue explicitly first.
        An unchanged selection keeps its ID and revision. With no eligible articles or a dismissal
        in the current slot this returns 404. Reading is not a trigger for replacement.
        requestId replays the original result for at least 35 days; a new action needs a new UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0 }
                force: { type: boolean, default: false, description: Requires expectedRevision when true }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: Active issue, content: { application/json: { schema: { $ref: "#/components/schemas/Edition" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: "no_edition, with current EditionState", content: { application/json: { schema: { $ref: "#/components/schemas/EditionError" } } } }
        "409": { description: "revision_conflict or curated_edition_active with current EditionState, or request_id_reused", content: { application/json: { schema: { $ref: "#/components/schemas/EditionError" } } } }
  /native-preferences:
    get:
      tags: [NativePreferences]
      summary: Shared app presentation and edition preferences
      description: Defaults have revision 0 and updatedAt null until first written. Reading preferences never opts a web-only user into automatic editions. These settings have no effect on web folder ordering or web article filters.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NativePreferences" } } } }
    patch:
      tags: [NativePreferences]
      summary: Patch app preferences with revision and replay protection
      description: |
        Fields not supplied remain unchanged; arrays replace their whole field. IDs must be unique
        and refer to folders owned by the user. folderOrder may include null once for the unfiled
        section; folders omitted from this order append in GET /folders order. Renames retain IDs;
        deletion atomically prunes those IDs and emits a native_preferences sync change.
        First-time local adoption uses expectedRevision=0. A conflict returns current settings;
        retain the offline change and merge or ask the user instead of silently overwriting.
        requestId replays the original response for at least 35 days, even after newer updates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativePreferencesPatch" }
      responses:
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "200": { description: Updated or unchanged, content: { application/json: { schema: { $ref: "#/components/schemas/NativePreferences" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { description: folder_not_found }
        "409": { description: "revision_conflict with current NativePreferences, or request_id_reused", content: { application/json: { schema: { $ref: "#/components/schemas/NativePreferencesError" } } } }
  /inbox:
    post:
      tags: [Inbox]
      summary: Save a web clipping, URL, or note to Universal Inbox
      description: Captures an article URL (auto-extracting readable content) or direct content into the user's Inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                title: { type: string, maxLength: 500 }
                contentHtml: { type: string }
                textContent: { type: string }
                note: { type: string, maxLength: 20000 }
      responses:
        "201":
          description: Saved to inbox
          content: { application/json: { schema: { $ref: "#/components/schemas/Article" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityDenied" }
  /inbox/{id}:
    delete:
      tags: [Inbox]
      summary: Delete an item from Universal Inbox
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    Images:
      name: images
      in: query
      description: "`proxy` points the images of articles that are not archived at this server, so a client can keep them offline"
      schema: { type: string, enum: [original, proxy] }
  responses:
    Unauthorized: { description: Missing or invalid credentials }
    NotFound: { description: "Not found, or not visible to this user" }
    Invalid: { description: "Invalid input: { error: invalid_input }" }
    ReadOnly: { description: The token is read-only }
    CapabilityDenied:
      description: "The account lacks the capability or the token is read-only; stored content is retained"
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/CapabilityDenial" }
              - type: object
                required: [error]
                properties:
                  error: { type: string, const: read_only_token }
  schemas:
    AccountCapabilities:
      type: object
      required: [type, features, manageUrl]
      properties:
        type: { type: string, example: selfhosted, description: "Opaque display identifier; never overrides feature permissions" }
        features:
          type: object
          description: "Known keys: mcp, sync, notes, editions, fulltext, search.fts. Explicit false and missing keys deny access. Self-hosted instances enable all known keys."
          additionalProperties: { type: boolean }
        manageUrl: { type: [string, "null"], description: "Optional HTTPS account-management URL; does not grant an app license" }
    CapabilityDenial:
      type: object
      required: [error, capability, manageUrl]
      properties:
        error: { type: string, const: capability_not_available }
        capability: { type: string }
        manageUrl: { type: [string, "null"] }
    Meta:
      type: object
      properties:
        apiVersion: { type: integer }
        serverVersion: { type: string }
        features: { type: array, items: { type: string } }
        limits:
          type: object
          properties:
            maxMutationsPerRequest: { type: integer }
            retentionDays: { type: integer, description: "Maximum age in days; same as retention.maxDays, kept for older clients" }
            retention:
              type: object
              description: The server's cleanup rules. Deletions they cause are not announced through /sync, so clients apply the same rules locally. 0 switches a rule off; saved articles are never removed.
              properties:
                enabled: { type: boolean, description: Whether the daily cleanup runs at all }
                readDays: { type: integer, description: "Read articles older than this many days are removed" }
                maxDays: { type: integer, description: "All articles older than this many days are removed" }
                maxItemsPerFeed: { type: integer, description: "Only the newest articles up to this number are kept per feed" }
                protectActiveEdition: { type: boolean, description: Preserve active edition articles in offline copies, including read articles }
        minClientVersion: { type: [string, "null"] }
    PairingCode:
      type: object
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        pairingUrl: { type: string, description: "The content of the QR code" }
    Device:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        platform: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        current: { type: boolean }
    Subscription:
      type: object
      properties:
        id: { type: integer }
        url: { type: string }
        title: { type: [string, "null"] }
        siteUrl: { type: [string, "null"] }
        label: { type: [string, "null"] }
        folderId: { type: [integer, "null"] }
        folderName: { type: [string, "null"] }
        position: { type: integer }
        pollIntervalMinutes: { type: integer }
        fullTextMode: { type: string, enum: [auto, never] }
        notify: { type: boolean }
        badge: { type: boolean }
        iconHash: { type: [string, "null"] }
        iconUrl: { type: string }
        unreadCount: { type: integer }
        lastPolledAt: { type: [string, "null"] }
        lastSuccessAt: { type: [string, "null"] }
        lastError: { type: [string, "null"] }
        consecutiveErrors: { type: integer }
    Folder:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        iconSymbol: { type: [string, "null"] }
        subscriptionCount: { type: integer }
        unreadCount: { type: integer }
    ItemState:
      type: object
      properties:
        read: { type: boolean }
        saved: { type: boolean }
        savedAt: { type: [string, "null"] }
        archivedAt: { type: [string, "null"] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        hasNote: { type: boolean }
    ArticleContent:
      type: object
      required: [revision, source, status, attemptedAt, retryAt]
      properties:
        revision: { type: integer, minimum: 1, description: Increases when publisher content or article identity/image changes }
        source: { type: string, enum: [reader, feed, snippet] }
        status: { type: string, enum: [pending, ready, feed_only, consent_wall, paywall, bot_blocked, timeout, partial, failed] }
        attemptedAt: { type: [string, "null"], format: date-time }
        retryAt: { type: [string, "null"], format: date-time }
    Item:
      type: object
      properties:
        id: { type: integer }
        subscriptionId: { type: integer }
        subscriptionTitle: { type: [string, "null"] }
        title: { type: [string, "null"] }
        url: { type: [string, "null"] }
        publishedAt: { type: [string, "null"] }
        addedAt: { type: string }
        snippet: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        hasFullText: { type: boolean }
        content: { $ref: "#/components/schemas/ArticleContent" }
        contentHtml: { type: [string, "null"], description: Only with content included }
        fullTextHtml: { type: [string, "null"], description: Only with content included }
        state: { $ref: "#/components/schemas/ItemState" }
    ItemNote:
      type: object
      required: [itemId, content, revision, createdAt, updatedAt]
      properties:
        itemId: { type: integer }
        content: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteConflictState:
      type: object
      required: [itemId, content, revision, createdAt, updatedAt, deleted]
      properties:
        itemId: { type: integer }
        content: { type: [string, "null"], description: "Null after deletion" }
        revision: { type: integer, minimum: 0, description: "Increases on every edit, deletion and recreation" }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        deleted: { type: boolean }
    NoteConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string, const: revision_conflict }
        current: { $ref: "#/components/schemas/NoteConflictState" }
    NoteNotFound:
      type: object
      properties:
        error: { type: string, enum: [item_not_found, note_not_found] }
        current: { $ref: "#/components/schemas/NoteConflictState", description: "Present for note_not_found" }
    EditionMetadata:
      type: object
      required: [id, revision, source, period, createdAt, updatedAt, expiresAt, preferencesRevision, title, summary, itemIds]
      properties:
        id: { type: string, description: Opaque issue identity; newly published issues use UUIDs }
        revision: { type: integer }
        source: { type: string, enum: [automatic, curated] }
        period: { type: string, enum: [morning, midday, evening, late] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        preferencesRevision: { type: integer, minimum: 0 }
        title: { type: [string, "null"], maxLength: 200 }
        summary: { type: [string, "null"], maxLength: 2000, description: Optional plain-text compatibility overview; derived from overview when omitted at publication }
        overview:
          description: Optional linked topics; present when edition.overview is advertised. Null for older or unstructured editions. Maximum 3000 UTF-16 code units across headings and segments.
          oneOf:
            - { type: "null" }
            - type: array
              minItems: 1
              maxItems: 5
              items: { $ref: "#/components/schemas/EditionOverviewBlock" }
        itemIds: { type: array, minItems: 1, maxItems: 24, uniqueItems: true, items: { type: integer, minimum: 1 } }
    EditionOverviewBlock:
      type: object
      required: [id, heading, segments]
      properties:
        id: { type: string, description: Stable within this issue; generated by the server }
        heading: { type: string, minLength: 1, maxLength: 160 }
        segments:
          type: array
          minItems: 1
          maxItems: 20
          description: Concatenate as plain text. Optional itemId makes a segment a native article link; at least one link per topic. Never interpret segment text as Markdown or HTML.
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: { type: string, minLength: 1, maxLength: 1000 }
              itemId: { type: integer, minimum: 1, description: Must belong to this issue's ordered itemIds }
    Edition:
      allOf:
        - { $ref: "#/components/schemas/EditionMetadata" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Item" } }
    EditionState:
      type: object
      required: [revision, status, edition]
      properties:
        revision: { type: integer, minimum: 0, description: Monotonic slot revision, retained after dismissal and expiry }
        status: { type: string, enum: [none, active, expired, dismissed] }
        edition:
          description: Edition metadata including ordered itemIds, without populated items; null when inactive
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/EditionMetadata" }
    EditionError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [no_edition, revision_conflict, request_id_reused, curated_edition_active] }
        current: { $ref: "#/components/schemas/EditionState" }
    NativePreferencesError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [revision_conflict, request_id_reused] }
        current: { $ref: "#/components/schemas/NativePreferences" }
    EditionCandidate:
      type: object
      required: [id, subscriptionId, folderId, title, url, publishedAt, snippet, imageUrl, readingMinutes, previouslySelected, score]
      properties:
        id: { type: integer }
        subscriptionId: { type: integer }
        folderId: { type: [integer, "null"] }
        title: { type: [string, "null"] }
        url: { type: [string, "null"] }
        publishedAt: { type: string, format: date-time }
        snippet: { type: [string, "null"] }
        imageUrl: { type: [string, "null"], description: Publisher URL; native apps load reader images through the authenticated proxy }
        readingMinutes: { type: integer, minimum: 1, description: Approximate length based on cached content }
        sourceName: { type: [string, "null"], description: Subscription label or feed title }
        folderName: { type: [string, "null"], description: Current section name }
        previouslySelected: { type: boolean, description: Appeared in a retained issue within the last 72 hours }
        score: { type: number, description: Base freshness and preference score before diversity adjustments }
    NativePreferences:
      type: object
      required: [revision, updatedAt, timeZone, editionSize, readingMinutes, folderOrder, hiddenFolderIds, preferredFolderIds, showUnfiled]
      properties:
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: [string, "null"], format: date-time }
        timeZone: { type: string, maxLength: 100, default: UTC, description: Shared IANA time zone }
        editionSize: { type: integer, minimum: 1, maximum: 24, default: 24 }
        editionSizeIsCustom: { type: boolean, readOnly: true, default: false, description: True only for an explicitly chosen personal article limit; otherwise a producer may use its own default }
        readingMinutes: { type: [integer, "null"], minimum: 5, maximum: 180, default: null }
        folderOrder: { type: array, maxItems: 1001, uniqueItems: true, items: { type: [integer, "null"], minimum: 1 } }
        hiddenFolderIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: integer, minimum: 1 } }
        preferredFolderIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: integer, minimum: 1 } }
        showUnfiled: { type: boolean, default: true }
    NativePreferencesPatch:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 0 }
        timeZone: { type: string, maxLength: 100, description: IANA time zone }
        editionSize: { type: [integer, "null"], minimum: 1, maximum: 24, description: An integer sets a personal maximum; null resets to the producer default. Omission preserves existing intent. }
        readingMinutes: { type: [integer, "null"], minimum: 5, maximum: 180 }
        folderOrder: { type: array, maxItems: 1001, uniqueItems: true, items: { type: [integer, "null"], minimum: 1 } }
        hiddenFolderIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: integer, minimum: 1 } }
        preferredFolderIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: integer, minimum: 1 } }
        showUnfiled: { type: boolean }
    SyncPage:
      type: object
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        nextSeq: { type: integer, description: Pass as `since` next time }
        hasMore: { type: boolean }
    Change:
      type: object
      properties:
        seq: { type: integer }
        entity: { type: string, enum: [item_state, item_content, subscription, folder, muted_keyword, note, edition, native_preferences] }
        id: { type: integer }
        op: { type: string, enum: [upsert, delete] }
        data: { type: object, description: "Current data for upserts. Note deletions carry {revision}; other deletions omit data." }
    Mutation:
      type: object
      required: [id, type, itemId, at]
      properties:
        id: { type: string, minLength: 8, maxLength: 64, description: Made by the client; makes retries harmless }
        type: { type: string, enum: [item.read, item.save, item.progress, item.note.set, item.note.delete] }
        itemId: { type: integer }
        value: { type: boolean, description: For item.read and item.save }
        position: { type: number, minimum: 0, maximum: 1, description: "For item.progress; below 5 % or above 95 % clears it" }
        content: { type: string, description: For item.note.set }
        expectedRevision: { type: integer, minimum: 0, description: "For item.note.set and item.note.delete; omit only for unconditional changes" }
        at: { type: string, format: date-time, description: "When the user did it; at most 5 minutes ahead of the server, at most 30 days old" }
    MutationResult:
      description: "A capability denial is retryable and does not consume the mutation UUID. Other entries in the batch still apply."
      type: object
      properties:
        id: { type: string }
        outcome: { type: string, enum: [applied, duplicate, stale, rejected, conflict] }
        error: { type: string, description: "invalid_mutation, invalid_time, item_not_found, revision_conflict, or capability_not_available" }
        capability: { type: string, description: "Required account capability when access was denied" }
        manageUrl: { type: [string, "null"] }
        retryable: { type: boolean, description: "True for capability denials; retain the mutation for a later retry" }
        current: { $ref: "#/components/schemas/NoteConflictState" }
