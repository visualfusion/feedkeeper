name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether the image needs building
        # A push to main that changes nothing the image is made of does not rebuild it; pull requests always do.
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null) && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qE '^(Dockerfile|\.dockerignore$|compose.*\.ya?ml$|package(-lock)?\.json$|server/package\.json$|web/package\.json$|\.github/workflows/(ci|docker)\.yml$)'; then
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Image needs building: $build"

      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.build == 'true'

      - name: Build Docker image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: feedkeeper:ci-test
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
